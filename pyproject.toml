[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onet_data_collector"
version = "0.2.0"
description = "A small ETL toolkit for turning O*NET Web Services data into tidy, analysis-ready tables."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Benjamin Chan" }]
keywords = ["onet", "occupations", "labor-market", "etl", "career-data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
onet-collect = "onet_data_collector.cli:main"

[project.urls]
Homepage = "https://github.com/Benjamin-V-Chan/ONET-Data-Collector"
Repository = "https://github.com/Benjamin-V-Chan/ONET-Data-Collector"

[tool.setuptools.packages.find]
include = ["onet_data_collector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
